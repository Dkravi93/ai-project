[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-hub"
version = "1.0.0"
description = "Multi-agent AI system for document analysis and complex reasoning"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core AI / LangChain
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-groq>=0.1.0",
    "groq>=0.7.0",

    # Embeddings / ML
    "sentence-transformers>=3.0.0",
    "numpy",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",

    # Vector database
    "qdrant-client>=1.11.0",

    # FastAPI / HTTP
    "fastapi[standard]>=0.111.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",

    # Document processing
    "PyMuPDF>=1.24.0",
    "pdfminer.six>=20221105",
    "python-docx",

    # Web / search
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "feedparser>=6.0.10",
    "arxiv>=1.4.8",
    "tavily-python>=0.3.0",
    "rank-bm25>=0.2.2",

    # Data / database
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",

    # Guardrails / security
    "presidio-analyzer>=0.2.210",
    "presidio-anonymizer>=0.2.210",
    "detoxify>=0.5.1",
    "ragas>=0.1.0",
    "nemo-toolkit>=0.11.0",

    # Code execution
    "RestrictedPython>=7.1",

    # Observability
    "mlflow>=2.10.0",
    "langsmith>=0.1.0",
    "prometheus-client>=0.20.0",

    # Evaluation
    "evaluate>=0.4.0",
    "nltk>=3.8.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "tenacity>=8.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
